name: MLX macOS baseline

on:
  workflow_dispatch:
  push:
    branches: [codex/macos-14-runtime]
  pull_request:
    paths: [scripts/pin-runtime-mlx.py, scripts/stage-python.py, tests/test_runtime_platform.py, .github/workflows/runtime-platform.yml]

permissions:
  contents: read

jobs:
  actual-metal-compute:
    if: github.repository == 'jindratilk/voicy'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - name: Retrieve exact reviewed installer helper
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            "https://raw.githubusercontent.com/jindratilk/voicy/$SOURCE_SHA/scripts/pin-runtime-mlx.py" \
            --output "$RUNNER_TEMP/pin-runtime-mlx.py"
      - name: Install pinned baseline wheels in a new isolated Python
        run: |
          set -euo pipefail
          uv venv --python 3.13 "$RUNNER_TEMP/mlx-baseline"
          python3 "$RUNNER_TEMP/pin-runtime-mlx.py" "$RUNNER_TEMP/mlx-baseline/bin/python"
      - name: Import MLX and execute real Metal computation
        run: |
          "$RUNNER_TEMP/mlx-baseline/bin/python" - <<'PY'
          import json, platform
          import mlx.core as mx
          mx.set_default_device(mx.gpu)
          x = mx.array([[1.0, 2.0], [3.0, 4.0]])
          y = x @ x
          mx.eval(y)
          if y.tolist() != [[7.0, 10.0], [15.0, 22.0]]:
              raise RuntimeError('Incorrect GPU matrix result')
          print(json.dumps({'macos': platform.mac_ver()[0], 'architecture': platform.machine(),
              'mlx_metal_import': 'passed', 'actual_gpu_compute': 'passed',
              'full_installer_or_model_test': False}))
          PY
