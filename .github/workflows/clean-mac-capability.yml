name: Clean Mac final installer qualification

on:
  workflow_dispatch:
  push:
    branches: [codex/clean-mac-qualification]
    paths: [.github/workflows/clean-mac-capability.yml]

permissions:
  contents: read

jobs:
  capability:
    if: github.repository == 'jindratilk/voicy'
    # GitHub denies draft-release reads to the default read token (HTTP 403).
    # This isolated trusted-branch job needs temporary repository write scope
    # solely to retrieve draft validation inputs; it performs only GET requests.
    permissions:
      contents: write
    # Standard free public-repository runner, no signing secrets or larger VM.
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - name: Measure architecture, Metal and memory before installer staging
        shell: bash
        run: |
          set -euo pipefail
          swift - <<'SWIFT'
          import Foundation
          import Metal
          import CoreGraphics

          #if arch(arm64)
          let architecture = "arm64"
          #else
          let architecture = "unsupported"
          #endif
          let device = MTLCreateSystemDefaultDevice()
          let filesystem = try FileManager.default.attributesOfFileSystem(forPath: NSHomeDirectory())
          let report: [String: Any] = [
              "scope": "Fresh hosted macOS capability only; no installer or release qualification",
              "architecture": architecture,
              "macos": ProcessInfo.processInfo.operatingSystemVersionString,
              "physical_memory_bytes": ProcessInfo.processInfo.physicalMemory,
              "available_disk_bytes": filesystem[.systemFreeSize] as? NSNumber ?? 0,
              "metal_device_available": device != nil,
              "metal_device": device?.name ?? "unavailable",
              "metal_recommended_working_set_bytes": device?.recommendedMaxWorkingSetSize ?? 0,
              "unified_memory": device?.hasUnifiedMemory ?? false,
              "gui_session_available": CGSessionCopyCurrentDictionary() != nil,
              "full_native_flow_tested": false,
          ]
          let data = try JSONSerialization.data(withJSONObject: report, options: [.prettyPrinted, .sortedKeys])
          print(String(decoding: data, as: UTF8.self))
          SWIFT
      - name: Retrieve reviewed qualification script at this exact source
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            "https://raw.githubusercontent.com/jindratilk/voicy/$SOURCE_SHA/scripts/release/qualify-clean-mac.py" \
            --output "$RUNNER_TEMP/qualify-clean-mac.py"
      - name: Download and verify frozen final installer and licensed fixture
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 "$RUNNER_TEMP/qualify-clean-mac.py" download
      - name: Assess signatures, launch packaged app and test actual inference
        # The app and inference never inherit the draft-access token.
        run: python3 "$RUNNER_TEMP/qualify-clean-mac.py" qualify
      - name: Show sanitized qualification evidence
        if: always()
        run: |
          if test -f "$RUNNER_TEMP/voicy-clean/report.json"; then
            cat "$RUNNER_TEMP/voicy-clean/report.json"
          fi
