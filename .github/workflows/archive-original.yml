name: Preserve immutable original Voicy installer
on:
  push:
    branches: [codex/clean-mac-qualification]
    paths: [.github/workflows/archive-original.yml, scripts/release/archive-original.py]
permissions:
  contents: read
jobs:
  archive:
    if: github.repository == 'jindratilk/voicy' && github.ref == 'refs/heads/codex/clean-mac-qualification'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: voicy-release-20261018
    permissions:
      contents: write
    env:
      VOICY_SOURCE_DIR: /tmp/voicy-original-sources-${{ github.run_id }}-${{ github.run_attempt }}
    outputs:
      release_id: ${{ steps.archive.outputs.release_id }}
      manifest_id: ${{ steps.archive.outputs.manifest_id }}
      manifest_hash: ${{ steps.archive.outputs.manifest_hash }}
      manifest_bytes: ${{ steps.archive.outputs.manifest_bytes }}
    steps:
      - name: Fetch only frozen Voicy archival code
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          mkdir -p "$VOICY_SOURCE_DIR"
          for script in hosted-corrected-release.py archive-original.py; do
            curl --fail --silent --show-error --location --retry 3 "https://raw.githubusercontent.com/jindratilk/voicy/$SOURCE_SHA/scripts/release/$script" --output "$VOICY_SOURCE_DIR/$script"
          done
      - name: Archive exact original bytes without publishing or overwriting any artifact
        id: archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 "$VOICY_SOURCE_DIR/archive-original.py" archive
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: voicy-original-archive-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/voicy-corrected-release/reports/
          retention-days: 7
  verify:
    needs: archive
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      VOICY_SOURCE_DIR: /tmp/voicy-original-sources-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Fetch the same immutable verification source
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          mkdir -p "$VOICY_SOURCE_DIR"
          for script in hosted-corrected-release.py archive-original.py; do
            curl --fail --silent --show-error --location --retry 3 "https://raw.githubusercontent.com/jindratilk/voicy/$SOURCE_SHA/scripts/release/$script" --output "$VOICY_SOURCE_DIR/$script"
          done
      - name: Independently retrieve every part and verify all original bytes on a fresh host
        env:
          GH_TOKEN: ${{ github.token }}
          VOICY_RELEASE_ID: ${{ needs.archive.outputs.release_id }}
          VOICY_MANIFEST_ID: ${{ needs.archive.outputs.manifest_id }}
          VOICY_MANIFEST_HASH: ${{ needs.archive.outputs.manifest_hash }}
          VOICY_MANIFEST_BYTES: ${{ needs.archive.outputs.manifest_bytes }}
        run: python3 "$VOICY_SOURCE_DIR/archive-original.py" verify
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: voicy-original-independent-proof-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/voicy-corrected-release/reports/
          retention-days: 7
