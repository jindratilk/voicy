name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm --prefix web ci
      - run: npm --prefix web test
      - run: npm --prefix web run build
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg libsndfile1
      - name: Install backend tests and the approved runtime overrides
        run: |
          python - <<'PY'
          import subprocess, sys
          from scripts.runtime_trust import runtime_packages
          subprocess.run([sys.executable, '-m', 'pip', 'install',
              'fastapi', 'uvicorn', 'python-multipart', 'numpy', 'scipy',
              'soundfile', 'librosa', 'pytest', 'httpx', *runtime_packages()], check=True)
          PY
      - run: python scripts/runtime_trust.py
      - run: python -m pytest tests/test_api.py tests/test_audio.py tests/test_auk.py tests/test_chunking.py tests/test_startup.py tests/test_processor_audio.py tests/test_memory_policy.py tests/test_auk_exact.py tests/test_runtime_platform.py tests/test_listening_review.py tests/test_e03_current.py tests/test_canonical_inputs.py tests/test_e03_trace.py tests/test_weight_loading.py tests/test_us_search_observation.py tests/test_runtime_qualification.py tests/test_download_counters.py -q
  website:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: landing/package-lock.json
      - run: npm --prefix landing ci
      - run: npm --prefix landing test
      - run: npm --prefix landing run build
