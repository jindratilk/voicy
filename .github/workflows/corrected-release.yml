name: Voicy corrected installer qualification
on:
  push:
    branches: [codex/clean-mac-qualification]
    paths:
      - .github/workflows/corrected-release.yml
      - scripts/release/hosted-corrected-release.py
permissions:
  contents: read
concurrency:
  group: voicy-corrected-release
  cancel-in-progress: false
jobs:
  build:
    if: github.repository == 'jindratilk/voicy' && github.ref == 'refs/heads/codex/clean-mac-qualification'
    runs-on: macos-14
    timeout-minutes: 120
    environment: voicy-release-20261018
    # Draft inputs and draft-only multipart output; no consumer release publish.
    permissions:
      contents: write
    env:
      VOICY_SOURCE_DIR: /tmp/voicy-release-sources-${{ github.run_id }}-${{ github.run_attempt }}
    outputs:
      release_id: ${{ steps.staging.outputs.release_id }}
      manifest_id: ${{ steps.staging.outputs.manifest_id }}
      manifest_hash: ${{ steps.staging.outputs.manifest_hash }}
      manifest_bytes: ${{ steps.staging.outputs.manifest_bytes }}
    steps:
      - name: Fetch only release helpers from the reviewed exact owner commit
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          mkdir -p "$VOICY_SOURCE_DIR"
          curl --fail --silent --show-error --location --retry 3 \
            "https://raw.githubusercontent.com/jindratilk/voicy/$SOURCE_SHA/scripts/release/hosted-corrected-release.py" \
            --output "$VOICY_SOURCE_DIR/hosted-corrected-release.py"
          sw_vers
          df -h "$RUNNER_TEMP"
      - name: Retrieve frozen exact signed app inputs and licensed fixture
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 "$VOICY_SOURCE_DIR/hosted-corrected-release.py" download-inputs
      - name: Verify the exact already accepted app, ticket and complete resources
        # Existing Accepted UUID is pinned to the same complete signed app; never reupload it.
        run: python3 "$VOICY_SOURCE_DIR/hosted-corrected-release.py" verify-accepted-app
      - name: Package the accepted full offline app
        run: python3 "$VOICY_SOURCE_DIR/hosted-corrected-release.py" package
      - name: Sign only the frozen DMG in an isolated temporary keychain
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: python3 "$VOICY_SOURCE_DIR/hosted-corrected-release.py" sign-dmg
      - name: New Apple notarization of the signed installer
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: python3 "$VOICY_SOURCE_DIR/hosted-corrected-release.py" dmg-notary
      - name: Staple and assess the frozen final installer
        run: python3 "$VOICY_SOURCE_DIR/hosted-corrected-release.py" staple-dmg
      - name: Retain exact installer only as an unpublished validation transport
        id: staging
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 "$VOICY_SOURCE_DIR/hosted-corrected-release.py" publish-internal
      - name: Detach only the task-owned source image
        if: always()
        run: |
          if test -f "$VOICY_SOURCE_DIR/hosted-corrected-release.py"; then
            python3 "$VOICY_SOURCE_DIR/hosted-corrected-release.py" cleanup
          fi
      - name: Retain sanitized build evidence, never credentials or raw Apple logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: voicy-corrected-build-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/voicy-corrected-release/reports/
          retention-days: 7
  qualify:
    needs: build
    if: github.repository == 'jindratilk/voicy' && github.ref == 'refs/heads/codex/clean-mac-qualification'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      # Known GitHub draft GET restriction. Token exists only in download step.
      contents: write
    env:
      VOICY_SOURCE_DIR: /tmp/voicy-release-sources-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Retrieve exact owner-reviewed qualification code
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          mkdir -p "$VOICY_SOURCE_DIR"
          for script in hosted-corrected-release.py qualify-clean-mac.py; do
            curl --fail --silent --show-error --location --retry 3 \
              "https://raw.githubusercontent.com/jindratilk/voicy/$SOURCE_SHA/scripts/release/$script" \
              --output "$VOICY_SOURCE_DIR/$script"
          done
      - name: Reassemble and verify the exact new signed notarized installer
        env:
          GH_TOKEN: ${{ github.token }}
          VOICY_RELEASE_ID: ${{ needs.build.outputs.release_id }}
          VOICY_MANIFEST_ID: ${{ needs.build.outputs.manifest_id }}
          VOICY_MANIFEST_HASH: ${{ needs.build.outputs.manifest_hash }}
          VOICY_MANIFEST_BYTES: ${{ needs.build.outputs.manifest_bytes }}
        run: python3 "$VOICY_SOURCE_DIR/hosted-corrected-release.py" download-final
      - name: Actual native startup, authenticated packaged AuK model and WAV export
        # No repository or Apple credentials enter this application step.
        run: python3 "$VOICY_SOURCE_DIR/hosted-corrected-release.py" qualify
      - name: Retain supported-host qualification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: voicy-corrected-${{ matrix.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/voicy-corrected-release/reports/
          retention-days: 7
